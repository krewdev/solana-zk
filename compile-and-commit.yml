name: Compile Circom and Commit Artifacts

on:
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true # so we can push commits

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Attempt to download circom binary
        env:
          CIRCOM_TAG: v2.0.0
        run: |
          set -e
          # try a few plausible artifact names from the iden3/circom releases
          urls=( \
            "https://github.com/iden3/circom/releases/download/${CIRCOM_TAG}/circom-linux" \
            "https://github.com/iden3/circom/releases/download/${CIRCOM_TAG}/circom" \
            "https://github.com/iden3/circom/releases/download/${CIRCOM_TAG}/circom-linux-x64" \
          )
          ok=0
          for u in "${urls[@]}"; do
            echo "Trying $u"
            if curl -fsSL -o circom "$u"; then
              ok=1
              break
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "Failed to download circom binary. Update CIRCOM_TAG or the URL in the workflow." >&2
            exit 1
          fi
          chmod +x circom

      - name: Compile circuit
        run: |
          ./circom zk-circuit/circuit.circom --r1cs --wasm --sym --c -o zk-circuit

      - name: Generate witness and keys (snarkjs)
        run: |
          cd zk-circuit
          # write a simple input.json for the compile step
          echo '{"publicRepos":5}' > input.json
          npm install --no-audit --no-fund
          npx --yes snarkjs groth16 setup circuit.r1cs ../powersOfTau28_hez_final_12.ptau circuit_0000.zkey || true
          # We don't always need to run full zkey steps in CI. The main goal is to produce circuit_js/ and circuit.r1cs

      - name: Commit compiled artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zk-circuit/circuit.r1cs zk-circuit/circuit_js || true
          git commit -m "CI: add compiled circom artifacts" || echo "No changes to commit"
          git push
 